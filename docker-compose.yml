services:
  passdrop:
    build: .
    image: passdrop:latest
    container_name: passdrop
    restart: unless-stopped
    ports:
      - "8082:8000"  # NAS 外部访问端口:容器内部端口
    volumes:
      - ./data:/data  # 持久化 SQLite 数据目录
    environment:
      # - SITE_TITLE=PassDrop  # 可选：设置后所有语言统一使用该标题；不设置则按页面语言自动显示
      - DEFAULT_LANG=zh  # 默认语言（zh / en / ja），无法从浏览器识别语言时使用
      - BASE_URL=https://passdrop.tmhcorps.cn
      - DEFAULT_EXPIRE_HOURS=2
      - DEFAULT_MAX_VIEWS=1
      - PASSWORD_LENGTH=16
      - DATABASE_PATH=/data/passdrop.db
